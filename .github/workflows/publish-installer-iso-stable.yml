name: Publish stable installer ISO tag

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Tested artifact-standard-iso-<iso sha>-source-<payload sha> tag
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: centos7-tkernel-installer-publish-stable
  cancel-in-progress: false

env:
  OCI_REPOSITORY: ghcr.io/${{ github.repository }}
  ORAS_VERSION: 1.3.3
  STABLE_TAG: artifact-standard-iso-stable

jobs:
  publish:
    name: Promote a tested ISO to stable
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Setup ORAS ${{ env.ORAS_VERSION }}
        uses: oras-project/setup-oras@v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote tested ISO
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          __main() {
            set -euo pipefail

            if [[ ! "${SOURCE_TAG}" =~ ^artifact-standard-iso-[0-9a-f]{12}-source-[0-9a-f]{12}$ ]]; then
              echo 'source_tag has an invalid format' >&2
              return 1
            fi
            _source_ref="${OCI_REPOSITORY}:${SOURCE_TAG}"
            _source_descriptor=$(oras manifest fetch --descriptor "${_source_ref}")
            _source_digest=$(jq -er '.digest' <<< "${_source_descriptor}")
            oras tag "${_source_ref}" "${STABLE_TAG}"
            _stable_descriptor=$(oras manifest fetch --descriptor \
              "${OCI_REPOSITORY}:${STABLE_TAG}")
            _stable_digest=$(jq -er '.digest' <<< "${_stable_descriptor}")
            test "${_source_digest}" = "${_stable_digest}"
          }

          __main "$@"
