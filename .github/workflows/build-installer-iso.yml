name: Build and test installer ISO

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-installer-iso.yml
      - isobuild/config/install.env
      - isobuild/installer/**
      - isobuild/scripts/**
      - isobuild/tests/**
  pull_request:
    paths:
      - .github/workflows/build-installer-iso.yml
      - isobuild/config/install.env
      - isobuild/installer/**
      - isobuild/scripts/**
      - isobuild/tests/**
  workflow_run:
    workflows:
      - Build Incus VM image
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      payload_ref:
        description: Immutable installer rootfs OCI reference ending in @sha256:<digest>
        required: true
        type: string
  repository_dispatch:
    types:
      - installer-rootfs-published

permissions:
  contents: read
  packages: write

concurrency:
  group: centos7-tkernel-installer-iso-${{ github.ref }}
  cancel-in-progress: false

env:
  OCI_REPOSITORY: ghcr.io/${{ github.repository }}
  ORAS_VERSION: 1.3.3
  BASELINE_PAYLOAD_REF: ghcr.io/lwmacct/260808-incus-bbiz-tx-centos7@sha256:42d8d2f7a974437794da7a20c15cc2efb68b02ac6ed10a22f09bed644f479d7d
  BUILD_REVISION: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

jobs:
  lint:
    name: Shell, workflow, and layout checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.BUILD_REVISION }}

      - name: Install lint dependencies
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends shellcheck
          }

          __main "$@"

      - name: Run local checks
        shell: bash
        run: bash isobuild/scripts/lint.sh

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            docker run --rm \
              -v "${GITHUB_WORKSPACE}:/repo" \
              -w /repo \
              rhysd/actionlint:1.7.7 \
              -color
          }

          __main "$@"

  build:
    name: Build ISO, install with QEMU, and boot
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    needs: lint
    runs-on: ubuntu-26.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          ref: ${{ env.BUILD_REVISION }}

      - name: Resolve immutable payload reference
        shell: bash
        env:
          DISPATCH_PAYLOAD_REF: ${{ github.event.client_payload.payload_ref }}
          MANUAL_PAYLOAD_REF: ${{ inputs.payload_ref }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          __main() {
            set -euo pipefail

            _payload_ref=${MANUAL_PAYLOAD_REF:-${DISPATCH_PAYLOAD_REF:-}}
            if [ "${{ github.event_name }}" = workflow_run ]; then
              _producer_sha="${WORKFLOW_RUN_HEAD_SHA}"
              [[ "${_producer_sha}" =~ ^[0-9a-f]{40}$ ]]
              echo "PAYLOAD_SOURCE_TAG=artifact-standard-installer-rootfs-sha-${_producer_sha:0:12}" >> "${GITHUB_ENV}"
            elif [ -z "${_payload_ref}" ]; then
              _payload_ref="${BASELINE_PAYLOAD_REF}"
            fi
            if [ -n "${_payload_ref}" ] \
              && [[ ! "${_payload_ref}" =~ ^ghcr\.io/lwmacct/260808-incus-bbiz-tx-centos7@sha256:[0-9a-f]{64}$ ]]; then
              echo 'payload_ref must be the approved upstream repository followed by @sha256:<64 lowercase hex characters>' >&2
              return 1
            fi
            {
              [ -z "${_payload_ref}" ] || echo "PAYLOAD_OCI_REF=${_payload_ref}"
              echo "PAYLOAD_DIR=${RUNNER_TEMP}/installer-rootfs"
              echo "ISO_OUTPUT_DIR=${RUNNER_TEMP}/installer-iso"
              echo "QEMU_LOG_DIR=${RUNNER_TEMP}/qemu-logs"
              echo "ISO_VERSION=$(date -u +%Y%m%d_%H%M)"
            } >> "${GITHUB_ENV}"
          }

          __main "$@"

      - name: Install build and test dependencies
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              debootstrap \
              dosfstools \
              e2fsprogs \
              gdisk \
              grub-efi-amd64-bin \
              grub-pc-bin \
              jq \
              mtools \
              ovmf \
              parted \
              qemu-system-x86 \
              qemu-utils \
              squashfs-tools \
              util-linux \
              xfsprogs \
              xorriso
          }

          __main "$@"

      - name: Setup ORAS ${{ env.ORAS_VERSION }}
        uses: oras-project/setup-oras@v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify installer rootfs
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            if [ -n "${PAYLOAD_SOURCE_TAG:-}" ]; then
              _source_ref="${OCI_REPOSITORY}:${PAYLOAD_SOURCE_TAG}"
              _descriptor=$(oras manifest fetch --descriptor "${_source_ref}")
              _digest=$(jq -er '.digest' <<< "${_descriptor}")
              echo "PAYLOAD_OCI_REF=${OCI_REPOSITORY}@${_digest}" >> "${GITHUB_ENV}"
              PAYLOAD_OCI_REF="${OCI_REPOSITORY}@${_digest}"
            fi
            if [[ ! "${PAYLOAD_OCI_REF}" =~ ^ghcr\.io/lwmacct/260808-incus-bbiz-tx-centos7@sha256:[0-9a-f]{64}$ ]]; then
              echo 'resolved payload_ref is not an immutable approved OCI reference' >&2
              return 1
            fi
            mkdir -p "${PAYLOAD_DIR}"
            _descriptor=$(oras manifest fetch --descriptor "${PAYLOAD_OCI_REF}")
            _resolved_digest=$(jq -er '.digest' <<< "${_descriptor}")
            _expected_digest=${PAYLOAD_OCI_REF##*@}
            test "${_resolved_digest}" = "${_expected_digest}"
            _manifest=$(oras manifest fetch "${PAYLOAD_OCI_REF}")
            jq -e \
              '.artifactType == "application/vnd.lwmacct.installer-rootfs.v2"' \
              <<< "${_manifest}"
            oras pull --output "${PAYLOAD_DIR}" "${PAYLOAD_OCI_REF}"
            bash isobuild/scripts/validate-payload.sh "${PAYLOAD_DIR}" "${PAYLOAD_OCI_REF}"
          }

          __main "$@"

      - name: Build hybrid BIOS and UEFI installer ISO
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            sudo env \
              RUNNER_TEMP="${RUNNER_TEMP}" \
              PAYLOAD_OCI_REF="${PAYLOAD_OCI_REF}" \
              ISO_SOURCE_REPOSITORY="https://github.com/${GITHUB_REPOSITORY}" \
              ISO_SOURCE_REVISION="${BUILD_REVISION}" \
              ISO_VERSION="${ISO_VERSION}" \
              bash isobuild/scripts/build-iso.sh "${PAYLOAD_DIR}" "${ISO_OUTPUT_DIR}"
            sudo chown -R "$(id -u):$(id -g)" "${ISO_OUTPUT_DIR}"
          }

          __main "$@"

      - name: Inspect ISO structure
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            (
              cd "${ISO_OUTPUT_DIR}"
              sha256sum --check SHA256SUMS
            )
            bash isobuild/scripts/test-iso-structure.sh \
              "${ISO_OUTPUT_DIR}/installer.iso" \
              "${ISO_OUTPUT_DIR}/iso-manifest.json"
          }

          __main "$@"

      - name: Enable KVM for QEMU
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            test -c /dev/kvm
            sudo chmod 0666 /dev/kvm
            test -r /dev/kvm
            test -w /dev/kvm
            qemu-system-x86_64 -accel help | grep -qx 'kvm'
            ls -l /dev/kvm
          }

          __main "$@"

      - name: Install and boot with QEMU BIOS and UEFI
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            bash isobuild/scripts/test-install-qemu.sh \
              "${ISO_OUTPUT_DIR}/installer.iso" \
              "${QEMU_LOG_DIR}"
          }

          __main "$@"

      - name: Publish tested ISO to GHCR with ORAS
        if: >-
          (github.event_name == 'push' && github.ref == 'refs/heads/main')
          || (github.event_name == 'workflow_run'
              && github.event.workflow_run.conclusion == 'success'
              && github.event.workflow_run.head_branch == 'main')
          || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
          || (github.event_name == 'repository_dispatch' && github.ref == 'refs/heads/main')
        shell: bash
        env:
          ORAS_ARTIFACT_TYPE_ISO: application/vnd.lwmacct.installer-iso.v2
          ORAS_ISO_TYPE: application/vnd.lwmacct.bootable-iso
          ORAS_ISO_MANIFEST_TYPE: application/vnd.lwmacct.installer-iso.manifest.v2+json
          ORAS_CHECKSUM_TYPE: text/plain
        run: |
          __main() {
            set -euo pipefail

            _iso_revision=${BUILD_REVISION:0:12}
            _payload_revision=$(jq -er '.payload.source_revision' \
              "${ISO_OUTPUT_DIR}/iso-manifest.json")
            _payload_short_revision=${_payload_revision:0:12}
            _revision_tag="artifact-standard-iso-${_iso_revision}-source-${_payload_short_revision}"
            _latest_tag=artifact-standard-iso-latest
            (
              cd "${ISO_OUTPUT_DIR}"
              sha256sum --check SHA256SUMS
              oras push \
                --artifact-type "${ORAS_ARTIFACT_TYPE_ISO}" \
                --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                --annotation "org.opencontainers.image.revision=${BUILD_REVISION}" \
                --annotation "org.opencontainers.image.version=${ISO_VERSION}" \
                --annotation "io.github.lwmacct.payload.revision=${_payload_revision}" \
                "${OCI_REPOSITORY}:${_revision_tag}" \
                "installer.iso:${ORAS_ISO_TYPE}" \
                "iso-manifest.json:${ORAS_ISO_MANIFEST_TYPE}" \
                "SHA256SUMS:${ORAS_CHECKSUM_TYPE}"
            )
            oras tag "${OCI_REPOSITORY}:${_revision_tag}" "${_latest_tag}"
            _descriptor=$(oras manifest fetch --descriptor \
              "${OCI_REPOSITORY}:${_revision_tag}")
            _digest=$(jq -er '.digest' <<< "${_descriptor}")
            {
              echo '## Published tested installer ISO'
              echo
              echo "- \`${OCI_REPOSITORY}:${_revision_tag}\`"
              echo "- \`${OCI_REPOSITORY}:${_latest_tag}\`"
              echo "- \`${OCI_REPOSITORY}@${_digest}\`"
              echo "- Payload: \`${PAYLOAD_OCI_REF}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          __main "$@"
