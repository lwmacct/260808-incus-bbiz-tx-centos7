name: Build CentOS 7 Tlinux kernel Incus VM image

on:
  push:
    branches:
      - main
    paths:
      - images/centos.yaml
      - .github/workflows/build-incus-image.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: centos7-tkernel-incus-vm-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OCI_REPOSITORY: ghcr.io/${{ github.repository }}
  DISTROBUILDER_VERSION: 3.3.1
  DISTROBUILDER_CACHE_VERSION: 1
  ORAS_VERSION: 1.3.3
  ARCHITECTURE: amd64
  DISTROBUILDER_ARCHITECTURE: x86_64
  RELEASE: 7.9.2009
  VARIANT: default
  IMAGE_TYPE: vm
  KERNEL_PACKAGE_VERSION: 5.4.119-19.0009.67.3.tl2
  KERNEL_RELEASE: 5.4.119-19.0009.67.3
  KERNEL_TAG: tkernel-5.4.119-19.0009.67.3

jobs:
  build:
    name: centos 7.9.2009 / tkernel 5.4.119-19.0009.67.3 / amd64 / vm
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6.5.0
        with:
          go-version: "1.25.6"

      - name: Cache distrobuilder ${{ env.DISTROBUILDER_VERSION }}
        uses: actions/cache@v4.2.4
        with:
          path: ${{ runner.temp }}/distrobuilder-cache
          key: distrobuilder-${{ runner.os }}-amd64-${{ env.DISTROBUILDER_VERSION }}-go1.25.6-v${{ env.DISTROBUILDER_CACHE_VERSION }}

      - name: Install build and runtime dependencies
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              btrfs-progs \
              build-essential \
              ca-certificates \
              dnsmasq-base \
              dosfstools \
              gdisk \
              gpg \
              gpg-agent \
              jq \
              ovmf \
              qemu-system-modules-spice \
              qemu-system-x86 \
              qemu-utils \
              rsync \
              squashfs-tools \
              xz-utils \
              zstd
            sudo mkdir -p /etc/apt/keyrings
            sudo curl -fsSL https://pkgs.zabbly.com/key.asc \
              -o /etc/apt/keyrings/zabbly.asc
            sudo tee /etc/apt/sources.list.d/zabbly-incus-stable.sources >/dev/null <<EOF
          Enabled: yes
          Types: deb
          URIs: https://pkgs.zabbly.com/incus/stable
          Suites: $(. /etc/os-release && echo "${VERSION_CODENAME}")
          Components: main
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/zabbly.asc
          EOF
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends incus
            apt-cache policy incus
            apt-cache policy incus | grep -q 'https://pkgs.zabbly.com/incus/stable'
          }

          __main "$@"

      - name: Build and install distrobuilder ${{ env.DISTROBUILDER_VERSION }}
        shell: bash
        env:
          GOFLAGS: >-
            -tags=containers_image_storage_stub,containers_image_docker_daemon_stub,containers_image_openpgp
        run: |
          __main() {
            set -euo pipefail

            mkdir -p "${RUNNER_TEMP}/distrobuilder-cache"
            if [ ! -x "${RUNNER_TEMP}/distrobuilder-cache/distrobuilder" ]; then
              GOBIN="${RUNNER_TEMP}/distrobuilder-cache" \
                go install "github.com/lxc/distrobuilder/v3/distrobuilder@v${DISTROBUILDER_VERSION}"
            fi
            sudo install -m 0755 \
              "${RUNNER_TEMP}/distrobuilder-cache/distrobuilder" \
              /usr/local/bin/distrobuilder
            distrobuilder --version
          }

          __main "$@"

      - name: Setup Incus
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            sudo systemctl enable --now incus.socket
            sudo incus admin waitready
            sudo incus admin init --minimal
            sudo incus version
          }

          __main "$@"

      - name: Setup ORAS ${{ env.ORAS_VERSION }}
        uses: oras-project/setup-oras@v2.0.1
        with:
          version: ${{ env.ORAS_VERSION }}

      - name: Login to GHCR
        uses: docker/login-action@v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate image definition
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            sudo distrobuilder validate images/centos.yaml
          }

          __main "$@"

      - name: Prepare build directory
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            echo "SERIAL=$(date -u +%Y%m%d_%H%M)" >> "${GITHUB_ENV}"
            echo "OUTPUT_DIR=${RUNNER_TEMP}/incus-image" >> "${GITHUB_ENV}"
            sudo mkdir -p "${RUNNER_TEMP}/incus-image/vm"
            sudo chown -R "$(id -u):$(id -g)" "${RUNNER_TEMP}/incus-image"
          }

          __main "$@"

      - name: Build Incus VM image
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            sudo distrobuilder build-incus images/centos.yaml "${OUTPUT_DIR}/vm" \
              --type=split \
              --compression=xz \
              --vm \
              --timeout=7200 \
              -o image.architecture="${DISTROBUILDER_ARCHITECTURE}" \
              -o image.release="${RELEASE}" \
              -o image.variant="${VARIANT}" \
              -o image.serial="${SERIAL}" \
              -o source.url="https://vault.centos.org/"
          }

          __main "$@"

      - name: Normalize build files
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            sudo chown -R "$(id -u):$(id -g)" "${OUTPUT_DIR}"
          }

          __main "$@"

      - name: Test Incus VM image
        shell: bash
        run: |
          __cleanup() {
            sudo incus delete --force "${_test_instance}" 2>/dev/null || true
            sudo incus image delete "${_test_image}" 2>/dev/null || true
          }

          __diagnose() {
            sudo incus list "${_test_instance}" --format=yaml || true
            sudo incus info "${_test_instance}" --show-log || true
            sudo journalctl --no-pager --unit=incus -n 200 || true
          }

          __fail() {
            __diagnose
            exit 1
          }

          __main() {
            set -euo pipefail

            _test_image="ci-centos7-tkernel-vm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            _test_instance="${_test_image}-instance"
            trap __cleanup EXIT HUP INT TERM

            qemu-img check "${OUTPUT_DIR}/vm/disk.qcow2"
            sudo incus image import \
              "${OUTPUT_DIR}/vm/incus.tar.xz" \
              "${OUTPUT_DIR}/vm/disk.qcow2" \
              --alias "${_test_image}"
            sudo incus image list "${_test_image}" --format=json \
              | jq -e 'length == 1 and .[0].type == "virtual-machine"'

            sudo incus init "${_test_image}" "${_test_instance}" \
              --vm \
              -c security.secureboot=false \
              -c limits.cpu=2 \
              -c limits.memory=2GiB
            sudo incus start "${_test_instance}"

            _ready=false
            set +e
            for _attempt in $(seq 1 120); do
              sudo incus exec "${_test_instance}" -- sh -c "test -f /etc/os-release" >/dev/null 2>&1
              _agent_status=$?
              if [ "${_agent_status}" -eq 0 ]; then
                _ready=true
                break
              fi
              sleep 5
            done
            set -e

            test "${_ready}" = true || __fail
            sudo incus exec "${_test_instance}" -- grep -qx 'ID="centos"' /etc/os-release || __fail
            sudo incus exec "${_test_instance}" -- grep -qx 'VERSION_ID="7"' /etc/os-release || __fail

            if ! _guest_arch=$(sudo incus exec "${_test_instance}" -- uname -m); then
              __fail
            fi
            test "${_guest_arch}" = x86_64 || __fail

            if ! _guest_kernel=$(sudo incus exec "${_test_instance}" -- uname -r); then
              __fail
            fi
            test "${_guest_kernel}" = "${KERNEL_RELEASE}" || __fail

            for _package in kernel kernel-core kernel-modules; do
              sudo incus exec "${_test_instance}" -- \
                rpm -q "${_package}-${KERNEL_PACKAGE_VERSION}.x86_64" || __fail
            done

            sudo incus exec "${_test_instance}" -- \
              test -f "/boot/vmlinuz-${KERNEL_RELEASE}" || __fail
            if ! _default_kernel=$(sudo incus exec "${_test_instance}" -- grubby --default-kernel); then
              __fail
            fi
            test "${_default_kernel}" = "/boot/vmlinuz-${KERNEL_RELEASE}" || __fail

            sudo incus exec "${_test_instance}" -- modinfo virtio_scsi >/dev/null || __fail
            sudo incus exec "${_test_instance}" -- modinfo virtiofs >/dev/null || __fail
            sudo incus exec "${_test_instance}" -- \
              sh -c 'ip -4 -o addr show scope global | grep -q . && ip -4 route show default | grep -q "^default "' \
              || __fail

            sudo incus stop --force "${_test_instance}"
          }

          __main "$@"

      - name: Write checksums
        shell: bash
        run: |
          __main() {
            set -euo pipefail

            (
              cd "${OUTPUT_DIR}/vm"
              sha256sum incus.tar.xz disk.qcow2 > SHA256SUMS
            )
          }

          __main "$@"

      - name: Publish Incus VM image to GHCR with ORAS
        shell: bash
        env:
          ORAS_ARTIFACT_TYPE_VM: application/vnd.linuxcontainers.incus.virtual-machine-image.v1
          ORAS_METADATA_TYPE: application/vnd.linuxcontainers.incus.metadata.v1+tar+xz
          ORAS_DISK_TYPE: application/vnd.linuxcontainers.incus.disk.v1+qcow2
          ORAS_CHECKSUM_TYPE: text/plain
        run: |
          __main() {
            set -euo pipefail

            _tag="centos-${RELEASE}-${KERNEL_TAG}-${ARCHITECTURE}-${VARIANT}-vm-${SERIAL}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            _stable_tag="centos-${RELEASE}-${KERNEL_TAG}-${ARCHITECTURE}-${VARIANT}-vm"
            _major_tag="centos-7-${KERNEL_TAG}-${ARCHITECTURE}-${VARIANT}-vm"
            (
              cd "${OUTPUT_DIR}/vm"
              oras push \
                --artifact-type "${ORAS_ARTIFACT_TYPE_VM}" \
                --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
                --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
                --annotation "org.opencontainers.image.version=${SERIAL}" \
                --annotation "io.github.lwmacct.kernel.release=${KERNEL_RELEASE}" \
                "${OCI_REPOSITORY}:${_tag}" \
                "incus.tar.xz:${ORAS_METADATA_TYPE}" \
                "disk.qcow2:${ORAS_DISK_TYPE}" \
                "SHA256SUMS:${ORAS_CHECKSUM_TYPE}"
            )
            oras tag "${OCI_REPOSITORY}:${_tag}" "${_stable_tag}" "${_major_tag}"
            {
              echo "## Published Incus VM image"
              echo
              echo "- \`${OCI_REPOSITORY}:${_stable_tag}\`"
              echo "- \`${OCI_REPOSITORY}:${_major_tag}\`"
              echo "- \`${OCI_REPOSITORY}:${_tag}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
          }

          __main "$@"
