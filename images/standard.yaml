  types:
  - vm

- path: /etc/systemd/system/incus-agent-workaround.service
  generator: dump
  content: |-
    [Unit]
    Description=Incus - agent (CentOS 7 workaround)
    Before=incus-agent.service

    [Service]
    Type=oneshot
    ExecStart=-/bin/mkdir /run/incus_agent

    [Install]
    WantedBy=multi-user.target
  types:
  - vm

- path: /etc/systemd/system/incus-agent.service.d/incus.conf
  generator: dump
  content: |-
    [Service]
    WorkingDirectory=/run/incus_agent
  types:
  - vm

- generator: incus-agent
  types:
  - vm

packages:
  manager: yum
  update: true
  cleanup: true
  sets:
  - packages:
    - cronie
    - curl
    - hostname
    - initscripts
    - iproute
    - openssh-clients
    - passwd
    - policycoreutils
    - rootfiles
    - sudo
    - rsyslog
    - vim-minimal
    action: install

  - packages:
    - dhclient
    action: install

  - packages:
    - cronie-noanacron
    action: install

  - packages:
    - NetworkManager
    - shim
    - irqbalance
    - grub2-efi-x64
    - grubby
    action: install
    types:
    - vm

  - packages:
    - selinux-policy
    - selinux-policy-targeted
    action: remove

actions:
- trigger: post-unpack
  action: |-
    #!/bin/sh

    __main() {
      set -eux

      touch /etc/hosts /etc/hostname

      # Keep the build on the official Vault. The final image switches to the
      # mainland mirror pool in the post-files action below.
      cat > /etc/yum.repos.d/CentOS-Base.repo <<'EOF'
    [base]
    name=CentOS 7.9.2009 - Base
    baseurl=https://vault.centos.org/7.9.2009/os/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial

    [updates]
    name=CentOS 7.9.2009 - Updates
    baseurl=https://vault.centos.org/7.9.2009/updates/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial

    [extras]
    name=CentOS 7.9.2009 - Extras
    baseurl=https://vault.centos.org/7.9.2009/extras/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial
    EOF
    }

    __main "$@"

- trigger: post-packages
  action: |-
    #!/bin/sh

    __main() {
      set -eux

      mkdir -p /selinux
      echo 0 > /selinux/enforce
      sed -i '/^session.*pam_loginuid.so/s/^session/# session/' /etc/pam.d/*
    }

    __main "$@"

- trigger: post-files
  action: |-
    #!/bin/sh

    __prepare_machine_id() {
      : > /etc/machine-id
      rm -f /var/lib/dbus/machine-id
      systemd-machine-id-setup
      test -s /etc/machine-id
    }

    __reset_machine_id() {
      printf 'uninitialized\n' > /etc/machine-id
      rm -f /var/lib/dbus/machine-id
    }

    __configure_pcdn_data_mount() {
      install -d -m 0755 /pcdn_data/pcdn_index_data
      grep -qF 'LABEL=pcdn_index_data /pcdn_data/pcdn_index_data ' /etc/fstab \
        || printf '%s\n' \
          'LABEL=pcdn_index_data /pcdn_data/pcdn_index_data ext4 defaults 0 2' \
          >> /etc/fstab
    }

    __install_tlinux_kernel() {
      _kernel_base_url=https://mirrors.cloud.tencent.com/tlinux/2.4/tlinux-tkernel4/x86_64/RPMS
      _kernel_dir=/tmp/tlinux-kernel

      mkdir -p "${_kernel_dir}"
      _package=kernel-5.4.119-19.0006.tl2.x86_64.rpm
      curl -fsSL --retry 3 --retry-delay 2 \
        -o "${_kernel_dir}/${_package}" \
        "${_kernel_base_url}/${_package}"

      (
        cd "${_kernel_dir}"
        sha256sum --check <<'EOF'
    6b3f5af7d3985d81e8bf07e4240b44f47aa1324f5f5b2517e2908091d91107fb  kernel-5.4.119-19.0006.tl2.x86_64.rpm
    EOF
      )

      rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-Tlinux-2
      rpm --checksig "${_kernel_dir}/${_package}"
      yum install --assumeyes "${_kernel_dir}/${_package}"
      rpm -q kernel-5.4.119-19.0006.tl2.x86_64

      yum clean all
      rm -f "${_kernel_dir}"/*.rpm
      rmdir "${_kernel_dir}"
    }

    __cleanup_firmware_mount() {
      if mountpoint -q /sys/firmware; then
        umount /sys/firmware
      fi
    }

    __configure_boot() {
      _kernel_version=5.4.119-19-0006

      test -f "/boot/vmlinuz-${_kernel_version}"
      depmod -a "${_kernel_version}"
      dracut --kver "${_kernel_version}" --force

      trap __cleanup_firmware_mount EXIT HUP INT TERM
      mount -t tmpfs tmpfs /sys/firmware
      mkdir -p /sys/firmware/efi

      _grub_target="$(readlink -f /etc/grub2-efi.cfg)"
      grub2-mkconfig -o "${_grub_target}"
      sed -i "s#root=[^ ]*#root=${DISTROBUILDER_ROOT_UUID}#g" "${_grub_target}"
      grubby --set-default "/boot/vmlinuz-${_kernel_version}"

      _default_kernel="$(grubby --default-kernel)"
      test "${_default_kernel}" = "/boot/vmlinuz-${_kernel_version}"

      umount /sys/firmware
      trap - EXIT HUP INT TERM
    }

    __configure_runtime_repositories() {
      mkdir -p /etc/yum.repos.d/disabled
      find /etc/yum.repos.d -maxdepth 1 -type f -name '*.repo' \
        -exec mv -t /etc/yum.repos.d/disabled -- {} +
      cat > /etc/yum.repos.d/CentOS-Base.repo <<'EOF'
    [base]
    name=CentOS 7.9.2009 - Base - Mainland China
    baseurl=https://mirrors.cloud.tencent.com/centos-vault/7.9.2009/os/$basearch/
            https://mirrors.aliyun.com/centos-vault/7.9.2009/os/$basearch/
            https://mirrors.huaweicloud.com/centos-vault/7.9.2009/os/$basearch/
            https://mirrors.nju.edu.cn/centos-vault/7.9.2009/os/$basearch/
            https://mirrors.hit.edu.cn/centos-vault/7.9.2009/os/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial
    failovermethod=priority

    [updates]
    name=CentOS 7.9.2009 - Updates - Mainland China
    baseurl=https://mirrors.cloud.tencent.com/centos-vault/7.9.2009/updates/$basearch/
            https://mirrors.aliyun.com/centos-vault/7.9.2009/updates/$basearch/
            https://mirrors.huaweicloud.com/centos-vault/7.9.2009/updates/$basearch/
            https://mirrors.nju.edu.cn/centos-vault/7.9.2009/updates/$basearch/
            https://mirrors.hit.edu.cn/centos-vault/7.9.2009/updates/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial
    failovermethod=priority

    [extras]
    name=CentOS 7.9.2009 - Extras - Mainland China
    baseurl=https://mirrors.cloud.tencent.com/centos-vault/7.9.2009/extras/$basearch/
            https://mirrors.aliyun.com/centos-vault/7.9.2009/extras/$basearch/
            https://mirrors.huaweicloud.com/centos-vault/7.9.2009/extras/$basearch/
            https://mirrors.nju.edu.cn/centos-vault/7.9.2009/extras/$basearch/
            https://mirrors.hit.edu.cn/centos-vault/7.9.2009/extras/$basearch/
    enabled=1
    gpgcheck=1
    gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-centosofficial
    failovermethod=priority
    EOF
      yum clean all
    }

    __main() {
      set -eux

      # Kernel RPM scriptlets require a valid ID; guests must generate their own.
      __prepare_machine_id
      __install_tlinux_kernel
      __configure_boot
      __configure_pcdn_data_mount
      __configure_runtime_repositories
      __reset_machine_id

      systemctl enable NetworkManager.service
      systemctl enable incus-agent-workaround.service
      rm -Rf /var/lib/selinux/*
      systemctl mask systemd-firstboot.service
    }

    __main "$@"
