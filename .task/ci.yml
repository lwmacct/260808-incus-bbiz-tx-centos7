version: "3"

tasks:
  lint:
    desc: Run local syntax and logic checks
    cmds:
      - bash scripts/lint.sh

  validate-payload:
    desc: Validate an already downloaded installer rootfs payload
    requires:
      vars: [PAYLOAD_DIR, PAYLOAD_OCI_REF]
    cmds:
      - bash scripts/validate-payload.sh "{{.PAYLOAD_DIR}}" "{{.PAYLOAD_OCI_REF}}"
