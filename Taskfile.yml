# Taskfile.yml
# https://taskfile.dev
# To enable experimental features
# export TASK_X_FEATURE=1
# export TASK_X_REMOTE_TASKFILES=1
# https://taskfile.dev/docs/experiments/remote-taskfiles

version: "3"
dotenv: [".env", ".env.example", "{{.HOME}}/.env"]

vars:
  TASK_REMOTE: "github.com/lwmacct/251207-task-remote.git/"

includes:
  env:
    taskfile: https://{{.TASK_REMOTE}}/.task/env.yml?ref=main
    optional: true
    flatten: true

  git:
    taskfile: https://{{.TASK_REMOTE}}/.task/git.yml?ref=main
    optional: true

  ci:
    taskfile: .task/ci.yml
    optional: true

tasks:
  isobuild:lint:
    desc: Run ISO builder syntax and logic checks
    cmds:
      - bash isobuild/scripts/lint.sh

  isobuild:validate-payload:
    desc: Validate a downloaded installer rootfs payload
    requires:
      vars: [PAYLOAD_DIR, PAYLOAD_OCI_REF]
    cmds:
      - bash isobuild/scripts/validate-payload.sh "{{.PAYLOAD_DIR}}" "{{.PAYLOAD_OCI_REF}}"
